name: Channel manifest

# Regenerates channels.json on gh-pages from the apt suites and main's
# gh-pages/channels.meta.json, copies main's gh-pages/install.sh to
# install.sh (the curl | sh installer), and commits both in one commit made
# only when either changed.  release-deb and promote do the same with every
# apt change; this workflow publishes installer, label, description or
# default changes without a release, and creates the first channels.json.
# Both files always come from main, never from a tag, so re-running an old
# release does not bring back an old installer or old labels.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gh-pages/channels.meta.json'
      - 'gh-pages/install.sh'
      - 'scripts/gen_channels_json.py'
      - '.github/workflows/channels-manifest.yml'

permissions:
  contents: write

# Shared with release-deb's publish-apt job and promote, which also commit
# to gh-pages, so their pushes never race.  GitHub keeps one pending run per
# group: a run queued while another is already pending replaces it, so
# re-run any that shows as cancelled.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: apt

      - name: Checkout channel manifest generator and installer
        uses: actions/checkout@v5
        with:
          ref: main
          path: src
          sparse-checkout: |
            scripts/gen_channels_json.py
            gh-pages/channels.meta.json
            gh-pages/install.sh
          sparse-checkout-cone-mode: false

      # Each file is published on its own: an install.sh that is missing or
      # fails `sh -n`, or a channels.json the generator cannot build, leaves
      # that file's published copy as it is, the other is still committed,
      # and the run fails so the error is seen.
      - name: Regenerate channels.json and publish install.sh
        run: |
          git -C apt config user.name "onvif-recorder-release-bot"
          git -C apt config user.email "noreply@github.com"
          MAIN_SHA=$(git -C src rev-parse --short HEAD)
          cd apt
          json_ok=true
          if ! python3 ../src/scripts/gen_channels_json.py --apt-root . \
              --meta ../src/gh-pages/channels.meta.json --out channels.json; then
            json_ok=false
            echo "::error::channels.json could not be regenerated from main ($MAIN_SHA); the published channels.json is unchanged"
          fi
          installer_ok=true
          if [ ! -f ../src/gh-pages/install.sh ]; then
            installer_ok=false
            echo "::error::gh-pages/install.sh is missing on main ($MAIN_SHA); the published install.sh is unchanged"
          elif sh -n ../src/gh-pages/install.sh; then
            install -m 0755 ../src/gh-pages/install.sh install.sh
          else
            installer_ok=false
            echo "::error::gh-pages/install.sh on main ($MAIN_SHA) fails sh -n; the published install.sh is unchanged"
          fi
          for f in channels.json install.sh; do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done
          json=false
          installer=false
          git diff --cached --quiet -- channels.json || json=true
          git diff --cached --quiet -- install.sh || installer=true
          case "$json,$installer" in
            true,true)  msg="Regenerate channels.json, publish install.sh from main $MAIN_SHA" ;;
            true,false) msg="Regenerate channels.json" ;;
            false,true) msg="Publish install.sh from main $MAIN_SHA" ;;
            *)          msg= ;;
          esac
          if [ -n "$msg" ]; then
            git commit -m "$msg"
            git push origin gh-pages
          else
            echo "channels.json and install.sh are unchanged"
          fi
          if [ "$json_ok" != true ] || [ "$installer_ok" != true ]; then
            exit 1
          fi
