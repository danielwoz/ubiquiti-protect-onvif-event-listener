name: Release .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.5.0)'
        required: true

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Only the from-source third-party submodules that aren't
      # available as prebuilt arm64 sysroot packages.  curl / libxml2
      # / openssl / libjpeg-turbo come from @arm64_sysroot, but
      # zstd and gperftools (tcmalloc) are always built from source.
      # The arm64 build itself only needs zstd + gperftools (curl, libxml2,
      # openssl and libjpeg-turbo come from @arm64_sysroot), but the x86
      # test gate below builds all of them from source via
      # new_local_repository, so every submodule has to be present.
      - name: Init submodules
        run: git submodule update --init --depth 1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build perl lld nasm \
            python3-pip curl git dpkg-dev fakeroot xz-utils qemu-user-static \
            binutils-aarch64-linux-gnu reprepro gnupg lintian \
            autoconf automake libtool pkg-config m4
          pip3 install --break-system-packages cpplint

      - name: cpplint
        run: python3 -m cpplint src/*.cpp src/*.hpp test/*.cpp test/*.hpp

      - name: Install Bazel
        run: |
          sudo curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      - name: Fetch NanoDet-M model files
        run: |
          curl -fL -o nanodet_m.param \
            https://github.com/nihui/ncnn-assets/raw/refs/heads/master/models/nanodet_m.param
          curl -fL -o nanodet_m.bin \
            https://github.com/nihui/ncnn-assets/raw/refs/heads/master/models/nanodet_m.bin

      # Release gate.  Nothing is built, uploaded or published to the apt
      # repo unless the suite is green first -- a tag must not be able to
      # ship code that fails its own tests.  Runs on x86 because that is
      # where the tests execute; the arm64 binary below is the same sources.
      - name: Test before releasing
        run: |
          scripts/bz test --config=x86 --test_output=errors //test:all

      - name: Compute version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 release binary
        run: |
          scripts/bz build --config=arm64_release //:onvif_recorder
          cp ~/.cache/bazel/arm64_release/execroot/_main/bazel-out/k8-fastbuild/bin/onvif_recorder \
             onvif_recorder_arm64

      - name: Build .deb
        run: |
          scripts/build-deb.sh --arch=arm64 \
            --binary=onvif_recorder_arm64 \
            --version=${{ steps.ver.outputs.version }}

      - name: Lint .deb
        run: |
          lintian --fail-on error --no-tag-display-limit \
            dist/onvif-recorder_*_arm64.deb

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            dist/onvif-recorder_${{ steps.ver.outputs.version }}_arm64.deb \
            --clobber

      - name: Hand the .deb to the apt publish job
        uses: actions/upload-artifact@v4
        with:
          name: onvif-recorder-deb
          path: dist/onvif-recorder_${{ steps.ver.outputs.version }}_arm64.deb
          if-no-files-found: error
          retention-days: 7

  # The gh-pages commit has its own job so that only it holds the
  # gh-pages-publish group, shared with promote and channels-manifest, which
  # also commit to gh-pages: their pushes never race, the group is held for
  # well under a minute, and the build and release upload above never wait
  # for those workflows or get cancelled by them. GitHub keeps one pending
  # job per group: one queued while another is already pending replaces it,
  # so re-run any that shows as cancelled.
  publish-apt:
    needs: build-deb
    runs-on: ubuntu-24.04
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Install reprepro + gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Import GPG signing key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "${GPG_SIGNING_KEY}" ]; then
            echo "GPG_SIGNING_KEY not set — skipping apt-repo publish"
            exit 0
          fi
          echo "${GPG_SIGNING_KEY}" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "GPG_KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Download .deb
        if: env.GPG_KEYID != ''
        uses: actions/download-artifact@v4
        with:
          name: onvif-recorder-deb
          path: dist

      # Checked out inside the group, so the commit below builds on every
      # earlier gh-pages change.
      - name: Checkout gh-pages
        if: env.GPG_KEYID != ''
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: apt

      # The generator, channels.meta.json and install.sh come from main, not
      # from the tag, so re-running an old tag does not bring back old labels
      # or an old installer.
      - name: Checkout channel manifest generator and installer
        if: env.GPG_KEYID != ''
        uses: actions/checkout@v5
        with:
          ref: main
          path: src
          sparse-checkout: |
            scripts/gen_channels_json.py
            gh-pages/channels.meta.json
            gh-pages/install.sh
          sparse-checkout-cone-mode: false

      # channels.json is regenerated in the same gh-pages commit as the
      # reprepro change, so the published channel versions always match the
      # apt suites.  main's install.sh goes into the same commit; one that
      # fails `sh -n` is left out with an error annotation, keeping the
      # published copy, and does not hold up the apt publish.
      - name: Publish to gh-pages apt repo (early-access)
        if: env.GPG_KEYID != ''
        env:
          VERSION: ${{ needs.build-deb.outputs.version }}
        run: |
          git -C apt config user.name "onvif-recorder-release-bot"
          git -C apt config user.email "noreply@github.com"
          MAIN_SHA=$(git -C src rev-parse --short HEAD)
          cd apt
          if [ ! -f conf/distributions ]; then
            echo "ERROR: gh-pages/conf/distributions missing — bootstrap the repo first." >&2
            exit 1
          fi
          reprepro --basedir . --outdir . includedeb early-access \
            "$GITHUB_WORKSPACE/dist/onvif-recorder_${VERSION}_arm64.deb"
          python3 ../src/scripts/gen_channels_json.py --apt-root . \
            --meta ../src/gh-pages/channels.meta.json --out channels.json
          if sh -n ../src/gh-pages/install.sh; then
            install -m 0755 ../src/gh-pages/install.sh install.sh
          else
            echo "::error::gh-pages/install.sh on main ($MAIN_SHA) fails sh -n; the published install.sh is unchanged"
          fi
          git add -A
          if git diff --cached --quiet -- install.sh; then
            git commit -m "Publish onvif-recorder ${VERSION} to early-access"
          else
            git commit -m "Publish onvif-recorder ${VERSION} to early-access" \
              -m "Also publishes install.sh from main ${MAIN_SHA}."
          fi
          git push origin gh-pages
