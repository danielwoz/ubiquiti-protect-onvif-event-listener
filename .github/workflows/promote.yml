name: Promote apt suite

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Source suite'
        required: true
        type: choice
        options: [early-access, rc]
        default: early-access
      to:
        description: 'Destination suite'
        required: true
        type: choice
        options: [rc, stable]
        default: rc
      version:
        description: 'Package version to promote (e.g. 1.5.0)'
        required: true

permissions:
  contents: write

# Shared with release-deb's publish-apt job and channels-manifest, which
# also commit to gh-pages, so their pushes never race.  GitHub keeps one
# pending run per group: a run queued while another is already pending
# replaces it, so re-run any that shows as cancelled.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Install reprepro + gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Import GPG signing key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          echo "${GPG_SIGNING_KEY}" | gpg --batch --import

      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: apt

      # The channel manifest generator, its metadata and install.sh, always
      # from main.
      - name: Checkout channel manifest generator and installer
        uses: actions/checkout@v5
        with:
          ref: main
          path: src
          sparse-checkout: |
            scripts/gen_channels_json.py
            gh-pages/channels.meta.json
            gh-pages/install.sh
          sparse-checkout-cone-mode: false

      # channels.json is regenerated in the same gh-pages commit as the
      # reprepro change; its versions are read from the resulting Packages
      # files, not from the version input.  main's install.sh goes into the
      # same commit; one that fails `sh -n` is left out with an error
      # annotation, keeping the published copy, and does not hold up the
      # promotion.
      - name: Promote
        run: |
          git -C apt config user.name "onvif-recorder-release-bot"
          git -C apt config user.email "noreply@github.com"
          MAIN_SHA=$(git -C src rev-parse --short HEAD)
          cd apt
          reprepro --basedir . --outdir . copy "${{ inputs.to }}" "${{ inputs.from }}" \
            onvif-recorder "${{ inputs.version }}"
          python3 ../src/scripts/gen_channels_json.py --apt-root . \
            --meta ../src/gh-pages/channels.meta.json --out channels.json
          if sh -n ../src/gh-pages/install.sh; then
            install -m 0755 ../src/gh-pages/install.sh install.sh
          else
            echo "::error::gh-pages/install.sh on main ($MAIN_SHA) fails sh -n; the published install.sh is unchanged"
          fi
          git add -A
          SUBJECT="Promote onvif-recorder ${{ inputs.version }}: ${{ inputs.from }} -> ${{ inputs.to }}"
          if git diff --cached --quiet -- install.sh; then
            git commit -m "$SUBJECT"
          else
            git commit -m "$SUBJECT" -m "Also publishes install.sh from main ${MAIN_SHA}."
          fi
          git push origin gh-pages
